# Default datasource pulled from env in docker-compose (QUARKUS_DATASOURCE_*).
# Local dev outside Docker: set those env vars or uncomment below.
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/task_scheduler_db
quarkus.hibernate-orm.database.generation=update
quarkus.jackson.write-dates-as-timestamps=true

# Test profile: in-memory H2 + Flyway-managed schema.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.flyway.locations=classpath:db/migration
